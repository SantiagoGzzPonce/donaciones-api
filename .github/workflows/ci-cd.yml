name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. Pruebas + calidad ----------
  test:
    name: Pruebas unitarias y calidad
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Pruebas con cobertura (umbral 80 %)
        run: npm run test:ci

      - name: Resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura de pruebas" >> $GITHUB_STEP_SUMMARY
          node -e "const s=require('./coverage/coverage-summary.json').total;for(const k of ['lines','statements','functions','branches'])console.log('- **'+k+'**: '+s[k].pct+' %')" >> $GITHUB_STEP_SUMMARY

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Análisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------- 2. Construcción ----------
  build:
    name: Construcción
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar solo dependencias de producción
        run: npm ci --omit=dev
      - name: Verificar que la app arranca (smoke test)
        run: |
          NODE_ENV=production JWT_SECRET=ci-smoke PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -fs http://localhost:3000/health && exit 0; sleep 1; done
          echo "La aplicación no arrancó" && exit 1
      - name: Empaquetar artefacto
        run: tar -czf donaciones-api.tar.gz src public package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: donaciones-api-build
          path: donaciones-api.tar.gz

  # ---------- 3. Pruebas de seguridad dinámicas (OWASP ZAP) ----------
  security:
    name: Escaneo OWASP ZAP
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Levantar la aplicación
        run: |
          NODE_ENV=production JWT_SECRET=zap-scan PORT=3000 node src/server.js &
          for i in $(seq 1 20); do curl -fs http://localhost:3000/health && break; sleep 1; done

      - name: ZAP Baseline (escaneo pasivo)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report
          cmd_options: '-a'

      - name: ZAP API Scan (escaneo activo: XSS, SQLi, etc.)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: docs/openapi.yaml
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-report
          cmd_options: '-a -O http://localhost:3000'

  # ---------- 4. Despliegue al entorno de pruebas ----------
  deploy:
    name: Despliegue a entorno de pruebas
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: pruebas
      url: ${{ vars.APP_URL }}
    steps:
      - name: Disparar despliegue en Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL"; exit 1; fi
          curl -fsS -X POST "$DEPLOY_HOOK"
      - name: Verificar salud del despliegue
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "::warning::Variable APP_URL no definida, se omite verificación"; exit 0; fi
          sleep 60
          for i in $(seq 1 20); do
            curl -fs "$APP_URL/health" && echo " -> Despliegue verificado" && exit 0
            echo "Esperando despliegue ($i/20)..."; sleep 15
          done
          echo "::error::El entorno de pruebas no respondió" && exit 1
